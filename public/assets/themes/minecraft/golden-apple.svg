<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="48" height="48" shape-rendering="crispEdges">
  <!-- Stem & Leaf -->
  <rect x="7" y="1" width="2" height="2" fill="#5c3e1e"/>
  <rect x="9" y="1" width="2" height="1" fill="#4ade80"/>
  <!-- Top Curve -->
  <rect x="5" y="2" width="2" height="1" fill="#8f6b1e"/>
  <rect x="9" y="2" width="2" height="1" fill="#8f6b1e"/>
  <!-- Outline -->
  <rect x="3" y="3" width="2" height="1" fill="#694b0d"/>
  <rect x="11" y="3" width="2" height="1" fill="#694b0d"/>
  <rect x="2" y="4" width="1" height="7" fill="#694b0d"/>
  <rect x="13" y="4" width="1" height="7" fill="#694b0d"/>
  <rect x="3" y="11" width="2" height="2" fill="#694b0d"/>
  <rect x="11" y="11" width="2" height="2" fill="#694b0d"/>
  <rect x="5" y="13" width="6" height="1" fill="#694b0d"/>
  <!-- Gold Body -->
  <rect x="4" y="4" width="8" height="7" fill="#facc15"/>
  <rect x="5" y="3" width="6" height="1" fill="#facc15"/>
  <rect x="5" y="11" width="6" height="2" fill="#d97706"/>
